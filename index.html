<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar ponto</title>
<style>
  :root {
    --bg: #eef3f8;
    --surface: #ffffff;
    --ink: #12283d;
    --muted: #5b7088;
    --line: #cfe2f3;
    --accent: #0b5394;
    --accent-ink: #ffffff;
    --ok: #1f6b43;
    --warn: #8a5a00;
    --err: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1b2a;
      --surface: #14283d;
      --ink: #e6eef7;
      --muted: #93a8bf;
      --line: #2a4562;
      --accent: #6fb1ea;
      --accent-ink: #0d1b2a;
      --ok: #6fd19b;
      --warn: #f0c46a;
      --err: #ff9a92;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
    padding: 20px 16px 40px;
  }
  main { max-width: 460px; margin: 0 auto; }

  .clock { text-align: center; padding: 18px 0 22px; }
  .clock .hora {
    font-size: 3.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .clock .data { margin-top: 8px; color: var(--muted); font-size: 1rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }

  label.campo, legend { display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; }
  fieldset { border: 0; padding: 0; margin: 20px 0 0; }

  input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 1.05rem;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
  }

  .tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tipos input { position: absolute; opacity: 0; pointer-events: none; }
  .tipos label {
    display: flex;
    align-items: center;
    min-height: 52px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1.2;
  }
  .tipos input:checked + label {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .tipos input:focus-visible + label,
  input[type="text"]:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  button {
    width: 100%;
    margin-top: 22px;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }

  #status { margin-top: 16px; min-height: 1.4em; text-align: center; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.warn { color: var(--warn); }
  #status.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <section class="clock" aria-live="off">
    <div class="hora" id="hora">--:--:--</div>
    <div class="data" id="data"></div>
  </section>

  <div class="card">
    <label class="campo" for="nome">Nome</label>
    <input type="text" id="nome" autocomplete="name" autocapitalize="characters" placeholder="Seu nome como está na planilha">

    <fieldset>
      <legend>Tipo de batida</legend>
      <div class="tipos" id="tipos"></div>
    </fieldset>

    <button type="button" id="enviar">Registrar ponto</button>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
// ============================================================
//  COLE AQUI a URL do Web App (Implantar > App da Web > termina em /exec)
// ============================================================
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymh9oOrQFJoB5gYmO7pCi2zWKzj_geEZr2Zjn7sMTVI91ZAsaVlfGdRqyiqJOPsPop/exec";

// mesmos textos e mesma ordem usados no Apps Script (mapTipoParaColuna)
const TIPOS = [
  { nome: "Entrada Manhã",        col: 2 },
  { nome: "Saída Café (Manhã)",   col: 3 },
  { nome: "Volta Café (Manhã)",   col: 4 },
  { nome: "Saída Almoço",         col: 5 },
  { nome: "Volta Almoço",         col: 6 },
  { nome: "Saída Café (Tarde)",   col: 7 },
  { nome: "Volta Café (Tarde)",   col: 8 },
  { nome: "Saída Tarde",          col: 9 }
];

const $ = id => document.getElementById(id);
const statusEl = $("status");
const btn = $("enviar");

function guardar(chave, valor) { try { localStorage.setItem(chave, valor); } catch (e) {} }
function ler(chave) { try { return localStorage.getItem(chave); } catch (e) { return null; } }

function hojeChave() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

function mostrar(msg, tipo) {
  statusEl.textContent = msg;
  statusEl.className = tipo || "";
}

// ---------- relógio ----------
function atualizarRelogio() {
  const d = new Date();
  $("hora").textContent = d.toLocaleTimeString("pt-BR", { hour12: false });
  $("data").textContent = d.toLocaleDateString("pt-BR", {
    weekday: "long", day: "2-digit", month: "long", year: "numeric"
  });
}
atualizarRelogio();
setInterval(atualizarRelogio, 1000);

// ---------- opções de batida ----------
TIPOS.forEach((t, i) => {
  const wrap = $("tipos");
  const input = document.createElement("input");
  input.type = "radio";
  input.name = "tipo";
  input.id = "tipo" + i;
  input.value = t.nome;
  const label = document.createElement("label");
  label.htmlFor = input.id;
  label.textContent = t.nome;
  wrap.appendChild(input);
  wrap.appendChild(label);
});

function selecionar(nomeTipo) {
  const el = [...document.querySelectorAll('input[name="tipo"]')].find(x => x.value === nomeTipo);
  if (el) el.checked = true;
}

// nome lembrado + sugere a próxima batida do dia
$("nome").value = ler("ponto_nome") || "";
(function sugerirProxima() {
  const ultima = ler("ponto_ultima");           // "AAAA-M-D|Tipo"
  if (ultima && ultima.split("|")[0] === hojeChave()) {
    const i = TIPOS.findIndex(t => t.nome === ultima.split("|")[1]);
    if (i >= 0 && i < TIPOS.length - 1) { selecionar(TIPOS[i + 1].nome); return; }
  }
  selecionar(TIPOS[0].nome);
})();

// ---------- localização ----------
function pegarLocalizacao() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve({ lat: "", lon: "" });
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => resolve({ lat: "", lon: "" }),
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
    );
  });
}

// ---------- confere na planilha se a batida entrou ----------
// devolve a hora (texto), false (não apareceu) ou null (não deu para conferir)
async function conferir(nome, col) {
  try {
    const r = await fetch(WEB_APP_URL + "?nome=" + encodeURIComponent(nome));
    const linhas = await r.json();
    const ultima = linhas[linhas.length - 1];
    if (!ultima || linhas.length < 2) return false;
    const p = String(ultima[1]).split("/").map(Number);
    const h = new Date();
    const ehHoje = p[0] === h.getDate() && p[1] === h.getMonth() + 1 && p[2] === h.getFullYear();
    const valor = String(ultima[col] || "").trim();
    return ehHoje && valor ? valor.slice(0, 5) : false;
  } catch (e) {
    return null;
  }
}

// ---------- envio ----------
btn.addEventListener("click", async () => {
  const nome = $("nome").value.trim();
  const marcado = document.querySelector('input[name="tipo"]:checked');

  if (WEB_APP_URL.indexOf("COLE_AQUI") === 0) {
    return mostrar("Cole a URL do Web App no começo do script desta página.", "err");
  }
  if (!nome) return mostrar("Digite seu nome.", "err");
  if (!marcado) return mostrar("Escolha o tipo de batida.", "err");

  const tipo = marcado.value;
  const col = TIPOS.find(t => t.nome === tipo).col;

  btn.disabled = true;
  mostrar("Pegando localização…");
  const { lat, lon } = await pegarLocalizacao();

  mostrar("Enviando…");
  try {
    // no-cors: o Apps Script não libera a resposta do POST para o navegador,
    // mas a requisição chega normalmente.
    await fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      body: new URLSearchParams({ nome, tipo, lat, lon })
    });
  } catch (e) {
    btn.disabled = false;
    return mostrar("Não foi possível enviar. Verifique a internet e tente de novo.", "err");
  }

  guardar("ponto_nome", nome);
  guardar("ponto_ultima", hojeChave() + "|" + tipo);

  mostrar("Conferindo na planilha…");
  const hora = await conferir(nome, col);

  if (hora) {
    mostrar(tipo + " registrada às " + hora + ".", "ok");
    const i = TIPOS.findIndex(t => t.nome === tipo);
    if (i < TIPOS.length - 1) selecionar(TIPOS[i + 1].nome);
  } else if (hora === false) {
    mostrar("Enviado, mas ainda não apareceu na planilha. Confira o nome e tente de novo.", "warn");
  } else {
    mostrar("Enviado. Não deu para conferir na planilha, confira lá.", "warn");
  }
  btn.disabled = false;
});
</script>
</body>
</html>
